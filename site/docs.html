<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitless Documentation</title>
  <meta name="description" content="API documentation for Waitless — self-hosted waitlist platform.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0B0F1A; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
    a { color: #818cf8; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 14px 32px; background: rgba(11,15,26,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
    .nav .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; }
    .nav .title { font-weight: 800; font-size: 18px; }
    .nav .subtitle { font-size: 13px; color: #475569; margin-left: 4px; }
    .nav .right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
    .nav .right a { color: #64748b; font-size: 14px; }
    .nav .right a:hover { color: #e2e8f0; text-decoration: none; }

    .layout { display: flex; padding-top: 58px; }
    .sidebar { width: 220px; position: fixed; top: 58px; bottom: 0; left: 0; padding: 24px 16px; border-right: 1px solid rgba(255,255,255,0.05); overflow-y: auto; }
    .sidebar .label { font-size: 11px; font-weight: 600; color: #334155; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 12px; margin-bottom: 10px; }
    .sidebar a { display: block; padding: 8px 12px; border-radius: 8px; color: #64748b; font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .sidebar a:hover, .sidebar a.active { background: rgba(99,102,241,0.1); color: #818cf8; text-decoration: none; }

    .content { flex: 1; margin-left: 220px; padding: 40px 48px; max-width: 820px; }
    .content h1 { font-size: 28px; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.02em; }
    .content h2 { font-size: 22px; font-weight: 800; margin: 48px 0 16px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); letter-spacing: -0.02em; }
    .content h2:first-of-type { border-top: none; margin-top: 0; }
    .content h3 { font-size: 16px; font-weight: 700; margin: 28px 0 12px; }
    .content p { color: #94a3b8; font-size: 14px; line-height: 1.7; margin: 0 0 16px; }
    .content code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .content pre { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px 18px; overflow-x: auto; margin: 0 0 16px; }
    .content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
    .content table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 13px; }
    .content th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .content td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #94a3b8; }
    .content strong { color: #e2e8f0; }
    .content blockquote { padding: 12px 16px; border-radius: 10px; margin: 0 0 16px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15); color: #60a5fa; font-size: 13px; }
    .content hr { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 32px 0; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { margin-left: 0; padding: 24px 20px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <span class="title" style="color:#e2e8f0">Waitless</span>
    <span class="subtitle">Docs</span>
  </a>
  <div class="right">
    <a href="index.html">← Home</a>
    <a href="https://github.com/waitlss/waitless" target="_blank">GitHub</a>
  </div>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="label">Documentation</div>
    <div id="nav"></div>
  </div>
  <div class="content" id="content">Loading...</div>
</div>

<script>
  const docs = ['README.md', 'public-api.md', 'rest-api-v1.md', 'dashboard-api.md', 'cli.md'];

  async function load() {
    let html = '';
    const navEl = document.getElementById('nav');

    for (const f of docs) {
      try {
        const res = await fetch(f);
        if (!res.ok) continue;
        const md = await res.text();
        html += marked.parse(md);
      } catch (e) {
        console.warn('Could not load', f, e);
      }
    }

    document.getElementById('content').innerHTML = html;

    // Syntax highlight code blocks
    document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

    // Build sidebar nav from headings
    document.querySelectorAll('h1, h2').forEach(el => {
      const id = el.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      el.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = el.textContent;
      a.onclick = function(e) {
        e.preventDefault();
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
      };
      navEl.appendChild(a);
    });

    // Activate first
    if (navEl.children[0]) navEl.children[0].classList.add('active');
  }

  load();
</script>

</body>
</html>
