name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs site
        run: |
          mkdir -p _site
          cat > _site/index.html << 'HEREDOC'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Waitless Documentation</title>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: 'Inter', sans-serif; background: #0B0F1A; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
              a { color: #818cf8; }
              nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 14px 32px; background: rgba(11,15,26,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
              nav .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 14px; }
              nav .title { font-weight: 800; font-size: 18px; }
              nav .subtitle { font-size: 13px; color: #475569; margin-left: 4px; }
              .layout { display: flex; padding-top: 58px; }
              .sidebar { width: 220px; position: fixed; top: 58px; bottom: 0; left: 0; padding: 24px 16px; border-right: 1px solid rgba(255,255,255,0.05); overflow-y: auto; }
              .sidebar a { display: block; padding: 8px 12px; border-radius: 8px; text-decoration: none; color: #64748b; font-size: 13px; font-weight: 500; margin-bottom: 2px; }
              .sidebar a:hover, .sidebar a.active { background: rgba(99,102,241,0.1); color: #818cf8; }
              .sidebar .label { font-size: 11px; font-weight: 600; color: #334155; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 12px; margin-bottom: 10px; }
              .content { flex: 1; margin-left: 220px; padding: 40px 48px; max-width: 820px; }
              .content h1 { font-size: 28px; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.02em; }
              .content h2 { font-size: 22px; font-weight: 800; margin: 48px 0 16px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); letter-spacing: -0.02em; }
              .content h3 { font-size: 16px; font-weight: 700; margin: 28px 0 12px; }
              .content p { color: #94a3b8; font-size: 14px; line-height: 1.7; margin: 0 0 16px; }
              .content code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
              .content pre { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px 18px; overflow-x: auto; margin: 0 0 16px; }
              .content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; }
              .content table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 13px; }
              .content th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.06); }
              .content td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #94a3b8; }
              .content blockquote { padding: 12px 16px; border-radius: 10px; margin: 0 0 16px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15); color: #60a5fa; font-size: 13px; }
              .content strong { color: #e2e8f0; }
              @media (max-width: 768px) { .sidebar { display: none; } .content { margin-left: 0; padding: 24px 20px; } }
            </style>
          </head>
          <body>
            <nav>
              <div class="logo">W</div>
              <span class="title">Waitless</span>
              <span class="subtitle">Docs</span>
            </nav>
            <div class="layout">
              <div class="sidebar">
                <div class="label">Documentation</div>
                <div id="nav"></div>
              </div>
              <div class="content" id="content">Loading...</div>
            </div>
            <script>
              const docs = ['README.md','public-api.md','rest-api-v1.md','dashboard-api.md','cli.md'];
              async function load() {
                let html = '';
                const navEl = document.getElementById('nav');
                for (const f of docs) {
                  const res = await fetch(f);
                  const md = await res.text();
                  html += marked.parse(md);
                }
                document.getElementById('content').innerHTML = html;
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                document.querySelectorAll('h1,h2').forEach(el => {
                  const id = el.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-');
                  el.id = id;
                  const a = document.createElement('a');
                  a.href = '#'+id; a.textContent = el.textContent;
                  navEl.appendChild(a);
                });
              }
              load();
            </script>
          </body>
          </html>
          HEREDOC
          cp docs/*.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
